name: Deploy server

on:
  workflow_call:
    inputs:
      digest:
        required: true
        type: string
      revision:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      digest:
        description: 'GHCR manifest digest to deploy (sha256:..., never a mutable tag)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    steps:
      - name: Skip superseded automatic deployments
        id: current
        env:
          REVISION: ${{ inputs.revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ -z "$REVISION" ] || [ "$REVISION" = "$head" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::A newer commit is on main; skipping this deployment.'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.current.outputs.deploy == 'true'
        with:
          ref: ${{ inputs.revision || github.sha }}
          persist-credentials: false
      - name: Deploy over verified SSH
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ inputs.digest }}
        run: bash scripts/deploy-via-ssh.sh
