name: Docker

on:
  pull_request:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-build:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/docker-platform.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}

  build:
    if: github.event_name == 'push' && !github.event.deleted
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/docker-platform.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish and verify multi-architecture manifest
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tagged_image="$image:$GITHUB_REF_NAME"
          docker buildx imagetools create -t "$tagged_image" "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"
          docker buildx imagetools inspect --raw "$tagged_image" > manifest.json
          python3 - <<'PY'
          import json
          platforms = {(m['platform']['os'], m['platform']['architecture']) for m in json.load(open('manifest.json'))['manifests']}
          assert platforms == {('linux', 'amd64'), ('linux', 'arm64')}, platforms
          PY
          digest="$(docker buildx imagetools inspect "$tagged_image" --format '{{.Manifest.Digest}}')"
          printf 'Published `%s` (amd64 + arm64). Pull by digest with `docker pull %s@%s`.\n' \
            "$tagged_image" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
