name: Docker

on:
  pull_request:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-build:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/docker-platform.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}

  build:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    uses: ./.github/workflows/docker-platform.yml
    with:
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}

  publish:
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish and verify multi-architecture manifest
        id: manifest
        env:
          REVISION: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create -t "$image:sha-$REVISION" "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"
          docker buildx imagetools inspect --raw "$image:sha-$REVISION" > manifest.json
          python3 - <<'PY'
          import json
          platforms = {(m['platform']['os'], m['platform']['architecture']) for m in json.load(open('manifest.json'))['manifests']}
          assert platforms == {('linux', 'amd64'), ('linux', 'arm64')}, platforms
          PY
          digest="$(docker buildx imagetools inspect "$image:sha-$REVISION" --format '{{.Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)"
          if [ "$head" = "$REVISION" ]; then
            docker buildx imagetools create -t "$image:latest" "$image@$digest"
          fi
          printf 'Published `%s@%s` (amd64 + arm64).\n' "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: publish
    if: vars.AUTO_DEPLOY == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      digest: ${{ needs.publish.outputs.digest }}
      revision: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
